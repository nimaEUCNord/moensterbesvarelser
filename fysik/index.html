<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fysik – Mønsterbesvarelser</title>
<meta name="description" content="Mønsterbesvarelser i fysik med lærerkommentarer.">
<script>
  try { var t = localStorage.getItem("hooke-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <a class="back" href="../">← Alle fag</a>
      <h1>Fysik</h1>
      <p class="lede">Klik på et dokument og se, hvad der gør det godt.</p>
    </div>
    <div class="seg" role="group" aria-label="Tema">
      <button type="button" data-theme-set="auto" aria-pressed="true" title="Følg enhedens indstilling">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>Auto</button>
      <button type="button" data-theme-set="light" aria-pressed="false" title="Lyst tema">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2v2.2M10 15.8V18M2 10h2.2M15.8 10H18M4.3 4.3l1.6 1.6M14.1 14.1l1.6 1.6M4.3 15.7l1.6-1.6M14.1 5.9l1.6-1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>Lys</button>
      <button type="button" data-theme-set="dark" aria-pressed="false" title="Mørkt tema">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.6A6.6 6.6 0 0 1 7.4 4a6.6 6.6 0 1 0 8.6 8.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Mørk</button>
    </div>
  </header>

  <main>
    <!-- Nyt dokument: kopiér et <a class="card">-kort, og husk at rette antallet på forsiden. -->
    <div class="grid">
      <a class="card" href="hookes-lov-journal.html">
        <span class="type">Journal</span>
        <h3>Hookes lov</h3>
        <p>Fysik C. Bestemmelse af fjederkonstanten for en skruefjeder med lodder og lineal, med graf i Excel og fejlkilder.</p>
        <span class="go">Åbn journalen →</span>
      </a>
    </div>
  </main>

  <footer>Dokumenterne kan også hentes som PDF og Word inde på hver side.</footer>
</div>
<script src="../assets/site.js"></script>
</body>
</html>
