<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>__TITEL__ – Mønsterbesvarelser</title>
<script>
  try { var t = localStorage.getItem("hooke-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<style>
:root {
  color-scheme: light;
  --ground: #E8ECF1;
  --paper: #FFFFFF;
  --ink: #18202B;
  --ink-2: #465262;
  --muted: #6A7584;
  --rule: #D3DAE2;
  --rule-soft: #E7EBF0;
  --pen: #1F4FA3;
  --pen-soft: #E3EBF9;
  --teacher: #B8234A;
  --teacher-bg: #FFF4F6;
  --good: #1D7445;
  --good-bg: #E5F3EA;
  --weak: #9A5400;
  --weak-bg: #FCF0DE;
  --xl: #1E7145;
  --xl-soft: #DCEFE3;
  --xl-sel: #C6E6D2;
  --xl-chrome: #F3F3F3;
  --focus: #1F4FA3;
  --canvas: #D5DAE1;
  --shadow: 0 1px 2px rgba(24,32,43,.06), 0 8px 24px rgba(24,32,43,.07);
  --card-shadow: 0 10px 30px rgba(24,32,43,.16);
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
  --doc: Cambria, "Iowan Old Style", Georgia, "Times New Roman", serif;
  --calibri: Aptos, Calibri, "Segoe UI", Carlito, Arial, sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #11151B; --paper: #1A2029; --ink: #E7EBF1; --ink-2: #B4BDC9; --muted: #8D97A4;
    --rule: #2F3845; --rule-soft: #252D38; --pen: #86ABF2; --pen-soft: #1F2C45;
    --teacher: #FF8DA7; --teacher-bg: #2A1C23;
    --good: #72D29E; --good-bg: #15301F; --weak: #F1B25E; --weak-bg: #33260F;
    --xl: #4CB67A; --xl-soft: #173323; --xl-sel: #1F4A31; --xl-chrome: #232A34;
    --focus: #86ABF2; --canvas: #0B0E12;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --card-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #11151B; --paper: #1A2029; --ink: #E7EBF1; --ink-2: #B4BDC9; --muted: #8D97A4;
  --rule: #2F3845; --rule-soft: #252D38; --pen: #86ABF2; --pen-soft: #1F2C45;
  --teacher: #FF8DA7; --teacher-bg: #2A1C23;
  --good: #72D29E; --good-bg: #15301F; --weak: #F1B25E; --weak-bg: #33260F;
  --xl: #4CB67A; --xl-soft: #173323; --xl-sel: #1F4A31; --xl-chrome: #232A34;
  --focus: #86ABF2; --canvas: #0B0E12;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --card-shadow: 0 10px 30px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.55 var(--sans);
  padding-inline: 16px;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
a { color: var(--pen); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { text-wrap: balance; }
.wrap { max-width: 1200px; margin-inline: auto; }

/* ---------- Topbjælke (samme som i assets/site.css) ---------- */
.sitebar { margin-inline: -16px; padding: 0 16px; background: var(--paper); border-bottom: 1px solid var(--rule); }
.sitebar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; min-height: 52px; padding-block: 8px; }
.brand { font: 700 17px/1.2 var(--doc); color: var(--ink); text-decoration: none; padding: 6px 10px; margin-left: -10px; border-radius: 6px; }
.brand:hover { background: var(--rule-soft); }
.brand[aria-current] { color: var(--pen); background: var(--pen-soft); }
.sitenav { display: flex; gap: 2px; }
.sitenav a { color: var(--ink-2); font-size: 14px; font-weight: 600; text-decoration: none; padding: 6px 10px; border-radius: 6px; }
.sitenav a:hover { background: var(--rule-soft); color: var(--ink); }
.sitenav a[aria-current] { color: var(--pen); background: var(--pen-soft); }
.theme-btn { margin-left: auto; display: inline-grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 1px solid var(--rule); border-radius: 7px; background: var(--paper); color: var(--ink-2); cursor: pointer; }
.theme-btn:hover { color: var(--ink); border-color: var(--muted); }
.theme-btn svg { width: 16px; height: 16px; }
@media (max-width: 420px) {
  .sitebar .wrap { gap: 4px 6px; }
  .brand { font-size: 15px; padding: 6px 7px; margin-left: -7px; }
  .sitenav a { font-size: 13px; padding: 6px 7px; }
}

/* ---------- Kompakt hoved ---------- */
.head { padding-block: 28px 20px; }
.head-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px 40px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
.head h1 { font-family: var(--doc); font-size: clamp(28px, 3.6vw, 38px); line-height: 1.12; margin: 0 0 10px; font-weight: 700; letter-spacing: -.01em; }
.head .lead { margin: 0; color: var(--ink-2); font-size: 15.5px; max-width: 64ch; }
.head-side { display: grid; gap: 10px; justify-items: end; }
.variants-row { display: flex; align-items: center; gap: 8px 10px; }
.variants-row .vl { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; background: var(--paper); }
.variants a, .variants span { font: 500 13px var(--sans); color: var(--ink-2); padding: 6px 12px; text-decoration: none; display: inline-flex; align-items: baseline; gap: 6px; }
.variants > * + * { border-left: 1px solid var(--rule); }
.variants a:hover { color: var(--ink); }
.variants a[aria-current="page"] { background: var(--pen-soft); color: var(--pen); font-weight: 600; }
.variants .off { color: var(--muted); cursor: default; }
.variants .off small { font-size: 11px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Knapper ---------- */
.btn { font: 600 13.5px var(--sans); color: var(--ink-2); background: var(--paper); border: 1px solid var(--rule); border-radius: 7px; padding: 7px 13px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { color: var(--ink); border-color: var(--muted); }
.btn.primary { background: var(--teacher); border-color: var(--teacher); color: var(--paper); }
.btn.primary:hover { color: var(--paper); filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn.icon { padding: 7px 9px; }
.btn[aria-pressed="false"] .eye-on, .btn[aria-pressed="true"] .eye-off { display: none; }

/* ---------- Sticky bar ---------- */
.toolbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin-inline: -16px; padding: 8px 16px;
  background: color-mix(in srgb, var(--ground) 90%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-block: 1px solid var(--rule);
}
.toolbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; }
.jump { display: flex; gap: 2px; }
.jump a { text-decoration: none; color: var(--ink-2); font-size: 14px; font-weight: 600; padding: 6px 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 7px; }
.jump svg { width: 16px; height: 16px; flex: none; }
.jump a[hidden] { display: none; }
.jump a:hover { background: var(--rule-soft); color: var(--ink); }
.controls { display: flex; align-items: center; gap: 8px; }

/* ---------- Dokument + margen ---------- */
.journal { padding-top: 20px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.viewer {
  max-width: 1200px; margin-inline: auto; background: var(--canvas); border: 1px solid var(--rule); border-radius: 10px;
  padding: 28px 24px; display: grid; grid-template-columns: minmax(0, 800px) minmax(0, 330px); justify-content: center; gap: 0 32px;
}
.pages { display: grid; gap: 22px; min-width: 0; align-content: start; }
.page { position: relative; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18), 0 6px 18px rgba(0,0,0,.08); }
.page img { display: block; width: 100%; height: auto; }
.layer { position: absolute; inset: 0; }
.hl-rect { position: absolute; border-radius: 3px; background: rgba(184, 35, 74, .13); box-shadow: 0 0 0 1.5px rgba(184, 35, 74, .55); pointer-events: none; opacity: 0; transition: opacity .18s; }
.hl-rect.on { opacity: 1; }
.lead-line { position: absolute; height: 0; border-top: 1.5px dashed rgba(184, 35, 74, .7); pointer-events: none; }
.marker {
  position: absolute; width: 22px; height: 22px; margin: -11px 0 0 5px; border-radius: 50%;
  border: 2px solid #B8234A; background: #fff; color: #B8234A; font: 700 11px/18px var(--sans); text-align: center;
  cursor: pointer; padding: 0; box-shadow: 0 1px 4px rgba(0,0,0,.2); transition: transform .12s, background .12s;
}
.marker:hover, .marker.hover { transform: scale(1.12); }
.marker.on { background: #B8234A; color: #fff; transform: scale(1.12); }
.marker:focus-visible { outline: 2px solid #1F4FA3; outline-offset: 2px; }

/* Læsetilstand: kommentarerne skjult, dokumentet i midten */
.viewer.no-markers { grid-template-columns: minmax(0, 800px); }
.no-markers .marker, .no-markers .hl-rect, .no-markers .lead-line, .no-markers .rail { display: none; }

.rail { position: relative; min-width: 0; }
.rail-head { font-size: 13px; color: var(--muted); padding: 2px 2px 0; }
.rail-head b { display: block; color: var(--ink); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }

/* Kommentarer i margenen */
.mc {
  position: absolute; left: 0; right: 0; background: var(--paper); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow);
  transition: top .22s ease, border-color .15s, opacity .15s;
}
.mc:hover, .mc.hover { border-color: var(--teacher); }
.rail.has-active .mc:not(.on) { opacity: .62; }
.rail.has-active .mc:not(.on):hover { opacity: 1; }
.mc-sum {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; width: 100%; text-align: left;
  padding: 10px 12px; border: 0; background: none; border-radius: 10px; cursor: pointer;
  font: 13.5px/1.45 var(--sans); color: var(--ink-2);
}
.mc-txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pills { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font: 600 11px/1 var(--sans); padding: 4px 8px; border-radius: 999px; background: var(--weak-bg); color: var(--weak); }
.pill.g { background: var(--pen-soft); color: var(--pen); }
.num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--teacher); color: var(--teacher); font: 700 11px/1 var(--sans); flex: none; }
.mc-full { display: none; padding: 12px 14px; font-size: 14.5px; line-height: 1.5; }
.mc.on { border: 1.5px solid var(--teacher); box-shadow: var(--card-shadow); z-index: 5; }
.mc.on .mc-sum { display: none; }
.mc.on .mc-full { display: block; animation: card-in .16s ease-out; }
.mc.on .num { background: var(--teacher); color: var(--paper); }
.mc.on::before {
  content: ""; position: absolute; left: -8px; top: var(--ay, 24px); width: 14px; height: 14px; margin-top: -7px;
  background: var(--paper); border-left: 1.5px solid var(--teacher); border-bottom: 1.5px solid var(--teacher); transform: rotate(45deg);
}
@keyframes card-in { from { opacity: 0; } to { opacity: 1; } }
.nh { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.nh b { font-size: 14px; }
.nh .nn { margin-left: auto; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.x { border: 0; background: transparent; color: var(--muted); font: 20px/1 var(--sans); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; }
.x:hover { background: var(--rule-soft); color: var(--ink); }
.card-b p { margin: 0 0 10px; }
.card-f { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
.pitfall { border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 10px 12px 12px; font-size: 13.5px; line-height: 1.45; display: grid; gap: 8px; margin: 0 0 10px; }
.pitfall h4 { margin: 0; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.pf { border-radius: 6px; padding: 7px 10px; }
.pf .tag { display: block; font-weight: 700; font-size: 12px; margin-bottom: 1px; }
.pf.weak { background: var(--weak-bg); }
.pf.weak .tag { color: var(--weak); }
.pf.strong { background: var(--good-bg); }
.pf.strong .tag { color: var(--good); }
.guide-link { display: inline-block; margin: 0 0 10px; font-size: 14px; font-weight: 600; text-decoration: none; }
.guide-link:hover { text-decoration: underline; }

/* ---------- Se også ---------- */
.part { padding-block: 44px 8px; }
.part-head { max-width: 1200px; margin: 0 auto 20px; }
.part-head h2 { font-family: var(--doc); font-size: 28px; line-height: 1.2; margin: 0 0 6px; }
.part-head p { margin: 0; color: var(--ink-2); max-width: 65ch; }
.see-also { max-width: 1200px; margin-inline: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.see-also a { display: flex; flex-direction: column; gap: 4px; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; box-shadow: var(--shadow); color: inherit; text-decoration: none; transition: border-color .15s; }
.see-also a:hover { border-color: var(--pen); }
.see-also .so-type { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.see-also b { font: 700 19px/1.25 var(--doc); }
.see-also span:last-child { color: var(--ink-2); font-size: 14px; }
footer { max-width: 1200px; margin: 40px auto 0; padding-block: 20px 36px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--rule); }


/* ---------- Smalle skærme: kommentaren som bundark ---------- */
@media (max-width: 1060px) {
  .viewer { grid-template-columns: minmax(0, 800px); padding: 16px 12px; }
  .rail { height: 0; min-height: 0 !important; }
  .rail-head, .lead-line { display: none; }
  .mc { display: none; }
  .mc.on {
    display: block; position: fixed; left: 12px; right: 12px; top: auto !important; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    max-width: 560px; margin-inline: auto; max-height: 55vh; overflow: auto; z-index: 30; animation: sheet-in .16s ease-out;
  }
  .mc.on::before { display: none; }
}
@keyframes sheet-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@media (max-width: 720px) {
  .head { padding-top: 20px; }
  .head-side { justify-items: start; }
  .jump span, #toggle-label { display: none; }
  .controls { flex: 1; }
  #start-tour { flex: 1; justify-content: center; }
  .viewer { padding: 10px 6px; border-radius: 8px; margin-inline: -10px; }
  .pages { gap: 12px; }
  .marker { width: 20px; height: 20px; margin: -10px 0 0 3px; font-size: 10px; line-height: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
@media print {
  body { background: #fff; padding: 0; }
  .sitebar, .toolbar, .rail, .actions, .marker, .lead-line, .hl-rect { display: none !important; }
  .viewer { display: block; border: 0; background: #fff; padding: 0; }
  .page { box-shadow: none; break-after: page; }
}
</style>
</head>
<body>

<div class="sitebar">
  <div class="wrap">
    <a class="brand" href="../">Mønsterbesvarelser</a>
    <nav class="sitenav" aria-label="Hovedmenu"><a href="./" id="nav-fag" aria-current="true">Fysik</a><a href="../vaerktoejer/">Værktøjer</a></nav>
    <button class="theme-btn" type="button" id="theme" aria-label="Tema"></button>
  </div>
</div>

<header class="wrap head">
  <div class="head-row">
    <div>
      <p class="eyebrow">__OVERLINJE__</p>
      <h1>__TITEL__</h1>
      <p class="lead">__INTRO__</p>
    </div>
    <div class="head-side">
      <div class="variants-row" id="variants" hidden><span class="vl">Lavet i</span><nav class="seg variants" aria-label="Version"></nav></div>
      <div class="actions">
        <a class="btn" id="dl-pdf" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10m0 0-4-4m4 4 4-4M4 16h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>PDF</a>
        <a class="btn" id="dl-docx" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10m0 0-4-4m4 4 4-4M4 16h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Word-filen</a>
      </div>
    </div>
  </div>
</header>

<div class="toolbar" id="toolbar">
  <div class="wrap">
    <nav class="jump" aria-label="Videre">
      <a id="tjekliste-link" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m6.5 10 2.4 2.4 4.6-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span></span></a>
    </nav>
    <div class="controls">
      <button class="btn" type="button" id="toggle-comments" aria-pressed="true">
        <svg class="eye-on" viewBox="0 0 20 20" aria-hidden="true"><path d="M1.8 10S4.8 4.5 10 4.5 18.2 10 18.2 10 15.2 15.5 10 15.5 1.8 10 1.8 10z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <svg class="eye-off" viewBox="0 0 20 20" aria-hidden="true"><path d="M1.8 10S4.8 4.5 10 4.5 18.2 10 18.2 10 15.2 15.5 10 15.5 1.8 10 1.8 10z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 17 17 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span id="toggle-label">Skjul kommentarer</span>
      </button>
      <button class="btn primary" type="button" id="start-tour">Gennemgå kommentarerne</button>
    </div>
  </div>
</div>

<main>
<section class="journal" id="journal" aria-labelledby="journal-h">
  <h2 class="sr" id="journal-h">Journalen</h2>
  <div class="viewer" id="viewer">
    <div class="pages" id="pages"></div>
    <aside class="rail" id="rail" aria-label="Lærerens kommentarer">
      <div class="rail-head" id="rail-head"><b>Lærerens kommentarer</b><span id="rail-count"></span></div>
    </aside>
  </div>
</section>

<section class="part" id="se-ogsaa" aria-labelledby="so-h" hidden>
  <div class="part-head"><h2 id="so-h">Se også</h2></div>
  <div class="see-also" id="see-also"></div>
</section>
</main>

<footer>Journalen er en lettere redigeret elevjournal til undervisningsbrug. Navnene er opdigtede.</footer>

<script id="journal-data" type="application/json">__JOURNAL_DATA__</script>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function $(id) { return document.getElementById(id); }
  function store(key, val) {
    try {
      if (val === undefined) return JSON.parse(localStorage.getItem(key));
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) { return null; }
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  var J = JSON.parse($("journal-data").textContent);
  if (J.sektion) $("nav-fag").href = "./#" + J.sektion;
  if (J.tjekliste) {
    var tl = $("tjekliste-link");
    tl.href = J.tjekliste.href; tl.querySelector("span").textContent = J.tjekliste.titel; tl.hidden = false;
  }
  if (J.seOgsaa && J.seOgsaa.length) {
    $("see-also").innerHTML = J.seOgsaa.map(function (l) {
      return '<a href="' + esc(l.href) + '"><span class="so-type">' + esc(l.type) + '</span><b>' + esc(l.titel) + '</b><span>' + esc(l.tekst) + '</span></a>';
    }).join("");
    $("se-ogsaa").hidden = false;
  }
  if (J.varianter && J.varianter.length > 1) {
    $("variants").querySelector("nav").innerHTML = J.varianter.map(function (v) {
      if (v.aktiv) return '<a href="' + esc(v.href) + '" aria-current="page">' + esc(v.navn) + '</a>';
      if (v.href) return '<a href="' + esc(v.href) + '">' + esc(v.navn) + '</a>';
      return '<span class="off" title="Kommer snart">' + esc(v.navn) + ' <small>kommer snart</small></span>';
    }).join("");
    $("variants").hidden = false;
  }
  function dl(id, file, mime) {
    if (!file || !file.data) return;
    var a = $(id);
    a.href = "data:" + mime + ";base64," + file.data; a.download = file.name; a.hidden = false;
  }
  dl("dl-pdf", J.pdf, "application/pdf");
  dl("dl-docx", J.docx, "application/vnd.openxmlformats-officedocument.wordprocessingml.document");

  /* ================= Sider og markeringer ================= */
  var pagesEl = $("pages"), viewer = $("viewer"), rail = $("rail"), railHead = $("rail-head"), toolbar = $("toolbar");
  var narrow = window.matchMedia("(max-width: 1060px)");
  var layers = J.pages.map(function (p, i) {
    var wrap = document.createElement("div");
    wrap.className = "page";
    wrap.innerHTML = '<img alt="Journalen, side ' + (i + 1) + ' af ' + J.pages.length + '" src="' + p.src + '" width="' + Math.round(p.w * 2) + '" height="' + Math.round(p.h * 2) + '"' + (i > 1 ? ' loading="lazy"' : '') + '><div class="layer"></div>';
    pagesEl.appendChild(wrap);
    return wrap.querySelector(".layer");
  });

  var C = J.comments, N = C.length, cur = -1;
  $("rail-count").textContent = N + " kommentarer · klik for at læse";
  function pitfallHTML(t) {
    return '<div class="pitfall"><h4>Typisk fejl: ' + esc(t.emne) + '</h4>' +
      '<div class="pf weak"><span class="tag">✗ Svag</span>' + esc(t.svag) + '</div>' +
      '<div class="pf strong"><span class="tag">✓ Stærk</span>' + esc(t.staerk) + '</div></div>';
  }
  var tmp = document.createElement("div");
  function hover(c, on) {
    c.markerEl.classList.toggle("hover", on);
    c.cardEl.classList.toggle("hover", on);
    if (C.indexOf(c) !== cur) c.rectEls.forEach(function (d) { d.classList.toggle("on", on); });
  }
  C.forEach(function (c, i) {
    c.rectEls = c.rects.map(function (r) {
      var d = document.createElement("div");
      d.className = "hl-rect";
      d.style.cssText = "left:" + r.b[0] + "%;top:" + r.b[1] + "%;width:" + r.b[2] + "%;height:" + r.b[3] + "%";
      layers[r.p].appendChild(d);
      return d;
    });
    var m = document.createElement("button");
    m.type = "button"; m.className = "marker"; m.textContent = i + 1;
    m.setAttribute("aria-label", "Lærerkommentar " + (i + 1));
    m.style.left = c.marker.x + "%"; m.style.top = c.marker.y + "%";
    m.addEventListener("click", function () { cur === i ? close() : open(i, false); });
    m.addEventListener("mouseenter", function () { hover(c, true); });
    m.addEventListener("mouseleave", function () { hover(c, false); });
    layers[c.marker.p].appendChild(m);
    c.markerEl = m;
    var line = document.createElement("div");
    line.className = "lead-line"; line.hidden = true;
    line.style.left = c.marker.x + "%"; line.style.top = c.marker.y + "%";
    line.style.width = "calc(" + (100 - c.marker.x) + "% + 32px)";
    layers[c.marker.p].appendChild(line);
    c.lineEl = line;

    // Kortet i margenen: sammenfoldet viser det starten af teksten, åbent hele kommentaren.
    tmp.innerHTML = c.tekst;
    var pills = (c.typiskFejl ? '<span class="pill">Typisk fejl</span>' : "") + (c.guide ? '<span class="pill g">Guide</span>' : "");
    var el = document.createElement("article");
    el.className = "mc";
    el.innerHTML =
      '<button type="button" class="mc-sum" aria-label="Åbn kommentar ' + (i + 1) + '"><span class="num">' + (i + 1) + '</span><span class="mc-txt">' + esc(tmp.textContent) + '</span>' + (pills ? '<span class="pills">' + pills + '</span>' : "") + '</button>' +
      '<div class="mc-full" role="dialog" aria-label="Kommentar ' + (i + 1) + ' af ' + N + '">' +
        '<div class="nh"><span class="num">' + (i + 1) + '</span><b>Lærer</b><span class="nn">Kommentar ' + (i + 1) + ' af ' + N + '</span><button class="x" type="button" aria-label="Luk kommentar">×</button></div>' +
        '<div class="card-b"><p>' + c.tekst + '</p>' + (c.typiskFejl ? pitfallHTML(c.typiskFejl) : "") +
          (c.guide ? '<a class="guide-link" href="' + esc(c.guide.href) + '">Se guiden: ' + esc(c.guide.titel) + ' →</a>' : "") + '</div>' +
        '<div class="card-f"><button class="btn prev" type="button"' + (i === 0 ? " disabled" : "") + '>← Forrige</button>' +
          '<button class="btn primary next" type="button">' + (i === N - 1 ? "Færdig ✓" : "Næste →") + '</button></div>' +
      '</div>';
    el.querySelector(".mc-sum").addEventListener("click", function () { open(i, false); });
    el.querySelector(".x").addEventListener("click", close);
    el.querySelector(".prev").addEventListener("click", function () { open(i - 1, true); });
    el.querySelector(".next").addEventListener("click", function () { if (i === N - 1) close(); else open(i + 1, true); });
    el.addEventListener("mouseenter", function () { hover(c, true); });
    el.addEventListener("mouseleave", function () { hover(c, false); });
    rail.appendChild(el);
    c.cardEl = el;
  });

  // Placér kortene ud for deres markering. Det åbne kort står præcis ud for sin markering;
  // de andre skubbes op eller ned, så de ikke overlapper (som kommentarer i Word).
  var GAP = 10;
  function layout() {
    if (narrow.matches || viewer.classList.contains("no-markers")) return;
    var base = rail.getBoundingClientRect().top, minTop = railHead.offsetHeight + 14;
    var want = [], h = [], top = [];
    C.forEach(function (c, i) {
      var r = c.markerEl.getBoundingClientRect();
      want[i] = r.top + r.height / 2 - base;
      h[i] = c.cardEl.offsetHeight;
    });
    var off = 21; // kortets nummer står ud for markeringen
    function fwd(from) { for (var i = from; i < N; i++) top[i] = Math.max(want[i] - off, i ? top[i - 1] + h[i - 1] + GAP : minTop); }
    if (cur < 0) fwd(0);
    else {
      top[cur] = Math.max(minTop, want[cur] - 30);
      fwd(cur + 1);
      for (var i = cur - 1; i >= 0; i--) top[i] = Math.min(want[i] - off, top[i + 1] - h[i] - GAP);
      if (top[0] < minTop) fwd(0);
    }
    C.forEach(function (c, i) { c.cardEl.style.top = top[i] + "px"; });
    if (cur >= 0) C[cur].cardEl.style.setProperty("--ay", Math.max(16, Math.min(h[cur] - 16, want[cur] - top[cur])) + "px");
    rail.style.minHeight = (top[N - 1] + h[N - 1]) + "px";
  }

  function open(i, scroll) {
    setComments(true);
    cur = Math.max(0, Math.min(N - 1, i));
    C.forEach(function (c, k) {
      var on = k === cur;
      c.markerEl.classList.toggle("on", on);
      c.rectEls.forEach(function (d) { d.classList.toggle("on", on); });
      c.lineEl.hidden = !on;
      c.cardEl.classList.toggle("on", on);
    });
    rail.classList.add("has-active");
    layout();
    if (scroll) scrollToCurrent();
    C[cur].cardEl.querySelector(".next").focus({ preventScroll: true });
  }
  function close() {
    cur = -1;
    C.forEach(function (c) {
      c.markerEl.classList.remove("on"); c.cardEl.classList.remove("on"); c.lineEl.hidden = true;
      c.rectEls.forEach(function (d) { d.classList.remove("on"); });
    });
    rail.classList.remove("has-active");
    layout();
  }
  function scrollToCurrent() {
    var c = C[cur], m = c.markerEl.getBoundingClientRect();
    var top = Math.min.apply(null, c.rectEls.map(function (d) { return d.getBoundingClientRect().top; }).concat(m.top));
    var tb = toolbar.offsetHeight;
    var target = window.scrollY + top - tb - (narrow.matches ? Math.min(window.innerHeight * 0.3, 120) : 110);
    if (!narrow.matches) {
      var cr = c.cardEl.getBoundingClientRect(), bottom = Math.max(cr.bottom, m.bottom);
      if (bottom - (top - tb - 110) > window.innerHeight) target = window.scrollY + Math.min(top, cr.top) - tb - 16;
    }
    window.scrollTo({ top: target, behavior: reduceMotion ? "auto" : "smooth" });
  }
  $("start-tour").addEventListener("click", function () { open(0, true); });
  document.addEventListener("keydown", function (e) {
    if (cur < 0 || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target.closest && e.target.closest("input, textarea")) return;
    if (e.key === "ArrowRight") { e.preventDefault(); if (cur < N - 1) open(cur + 1, true); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); if (cur > 0) open(cur - 1, true); }
    else if (e.key === "Escape") close();
  });
  window.addEventListener("resize", layout);
  window.addEventListener("load", layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(pagesEl);

  // Vis/skjul kommentarer: skjult giver en ren læsetilstand med dokumentet i midten.
  var tgl = $("toggle-comments");
  function setComments(on) {
    if (!on && cur >= 0) close();
    viewer.classList.toggle("no-markers", !on);
    tgl.setAttribute("aria-pressed", on);
    tgl.title = on ? "Skjul kommentarerne og læs journalen uforstyrret" : "Vis lærerens kommentarer";
    $("toggle-label").textContent = on ? "Skjul kommentarer" : "Vis kommentarer";
    tgl.setAttribute("aria-label", $("toggle-label").textContent);
    store("hooke-markers", on);
    layout();
  }
  tgl.addEventListener("click", function () { setComments(tgl.getAttribute("aria-pressed") !== "true"); });
  setComments(store("hooke-markers") !== false);

  /* ================= Tema: knappen i topbjælken skifter Auto → Lys → Mørk ================= */
  var ICONS = {
    auto: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>',
    light: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2v2.2M10 15.8V18M2 10h2.2M15.8 10H18M4.3 4.3l1.6 1.6M14.1 14.1l1.6 1.6M4.3 15.7l1.6-1.6M14.1 5.9l1.6-1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>',
    dark: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.6A6.6 6.6 0 0 1 7.4 4a6.6 6.6 0 1 0 8.6 8.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>'
  };
  var NAMES = { auto: "Auto (følger enheden)", light: "Lys", dark: "Mørk" }, NEXT = { auto: "light", light: "dark", dark: "auto" };
  var themeBtn = $("theme"), theme = root.getAttribute("data-theme") || "auto";
  function setTheme(t) {
    theme = t;
    if (t === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", t);
    themeBtn.innerHTML = ICONS[t];
    themeBtn.title = themeBtn.ariaLabel = "Tema: " + NAMES[t] + ". Klik for at skifte.";
    try { localStorage.setItem("hooke-theme", t); } catch (e) {}
  }
  themeBtn.addEventListener("click", function () { setTheme(NEXT[theme]); });
  setTheme(theme);

})();
</script>
</body>
</html>
